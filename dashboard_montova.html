<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montova · Panel de fumigaciones</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F4F6F4; min-height: 100vh; padding: 1rem; }
:root { --m-dark: #1E3D2F; --m-light: #E8F0EB; --gray2: #e0e0e0; --text: #1a1a1a; --text2: #555; }
.wrap { max-width: 900px; margin: 0 auto; }
.header { background: var(--m-dark); border-radius: 14px; padding: 1.5rem; margin-bottom: 1.25rem; display: flex; flex-direction: column; align-items: center; }
.header img { width: 160px; height: auto; }
.header-sub { color: rgba(255,255,255,0.7); font-size: 13px; margin-top: 10px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
.stat { background: #fff; border: 1px solid #e4ebe6; border-radius: 12px; padding: 1rem; }
.stat-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
.stat-val { font-size: 26px; font-weight: 600; color: var(--m-dark); }
.filtros { background: #fff; border: 1px solid #e4ebe6; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.filtro-group { flex: 1; min-width: 140px; }
.filtro-group label { font-size: 11px; color: var(--text2); display: block; margin-bottom: 4px; }
select { width: 100%; padding: 9px 10px; font-size: 13px; border: 1px solid var(--gray2); border-radius: 8px; color: var(--text); background: #fafafa; }
.btn-limpiar { padding: 9px 14px; font-size: 13px; border-radius: 8px; cursor: pointer; background: #fff; border: 1px solid var(--gray2); color: var(--text2); }
.btn-reload { padding: 9px 14px; font-size: 13px; border-radius: 8px; cursor: pointer; background: var(--m-dark); border: none; color: #fff; }
.tabla-wrap { background: #fff; border: 1px solid #e4ebe6; border-radius: 12px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: #f7faf8; }
th { padding: 11px 12px; text-align: left; font-weight: 600; color: var(--text2); font-size: 12px; border-bottom: 1px solid #e4ebe6; white-space: nowrap; }
td { padding: 10px 12px; color: var(--text); vertical-align: top; border-bottom: 1px solid #f0f0f0; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f9fbf9; }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 5px; margin: 2px 2px 2px 0; background: var(--m-light); color: var(--m-dark); }
.tag-plaga { background: #FAECE7; color: #993C1D; }
.tag-persona { background: #f0f0f0; color: #555; }
.empty { padding: 2.5rem; text-align: center; color: var(--text2); }
.conteo { font-size: 12px; color: var(--text2); text-align: right; padding: 8px 12px; border-top: 1px solid #f0f0f0; }
.loading { text-align: center; padding: 2rem; color: var(--text2); font-size: 14px; }
.novedad-texto { font-size: 12px; color: var(--text2); font-style: italic; max-width: 160px; }
@media (max-width: 600px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  table { min-width: 600px; }
}
</style>
</head>

function esEstaSemana(f) {
  const hoy = new Date();
  const lunes = new Date(hoy);
  lunes.setDate(hoy.getDate()-((hoy.getDay()+6)%7));
  lunes.setHours(0,0,0,0);
  return new Date(f) >= lunes;
}
async function cargarDatos() {
  document.getElementById('tabla-contenido').innerHTML = '<div class="loading">Cargando registros...</div>';
  try {
    const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
    const data = await res.json();
    todosLosRegistros = data.reverse();
    document.getElementById('stat-update').textContent = new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
    filtrar();
  } catch(e) {
    document.getElementById('tabla-contenido').innerHTML = '<div class="empty"><p>No se pudieron cargar los registros. Intenta de nuevo.</p></div>';
  }
}
function filtrar() {
  const finca = document.getElementById('filtro-finca').value;
  const lote = document.getElementById('filtro-lote').value;
  const lider = document.getElementById('filtro-lider').value;
  let data = todosLosRegistros;
  if (finca) data = data.filter(r => r.finca === finca);
  if (lote) data = data.filter(r => (r.lote||'').includes(lote));
  if (lider) data = data.filter(r => (r.lider||'').includes(lider));
  document.getElementById('stat-total').textContent = todosLosRegistros.length;
  document.getElementById('stat-semana').textContent = todosLosRegistros.filter(r => esEstaSemana(r.fecha)).length;
  if (data.length === 0) {
    document.getElementById('tabla-contenido').innerHTML = '<div class="empty"><p>No hay registros con estos filtros.</p></div>';
    return;
  }
  let html = '<div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Finca</th><th>Lote</th><th>Productos</th><th>Plagas</th><th>Líder</th><th>Equipo</th><th>Novedades</th></tr></thead><tbody>';
  data.forEach(r => {
    const productos = (r.productos||'').split(',').map(p=>'<span class="tag">'+p.trim()+'</span>').join('');
    const plagas = (r.plagas||'').split(',').map(p=>'<span class="tag tag-plaga">'+p.trim()+'</span>').join('');
    const lotes = (r.lote||'').split(',').map(l=>'<span class="tag">'+l.trim()+'</span>').join('');
    const equipo = (r.equipo||'').split(',').map(e=>'<span class="tag tag-persona">'+e.trim()+'</span>').join('');
    const novedad = r.novedades ? '<span class="novedad-texto">'+r.novedades+'</span>' : '<span style="color:#ccc">—</span>';
    html += '<tr><td style="white-space:nowrap">'+fmt(r.fecha)+'</td><td style="white-space:nowrap">'+(r.finca||'—')+'</td><td>'+lotes+'</td><td>'+productos+'</td><td>'+plagas+'</td><td style="white-space:nowrap;font-size:12px">'+(r.lider||'—')+'</td><td>'+equipo+'</td><td>'+novedad+'</td></tr>';
  });
  html += '</tbody></table></div><div class="conteo">Mostrando '+data.length+' registro'+(data.length!==1?'s':'')+'</div>';
  document.getElementById('tabla-contenido').innerHTML = html;
}
function limpiarFiltros() {
  document.getElementById('filtro-finca').value='';
  document.getElementById('filtro-lote').value='';
  document.getElementById('filtro-lider').value='';
  filtrar();
}
cargarDatos();
setInterval(cargarDatos, 60000);
</script>
